[tool:pytest]
DJANGO_SETTINGS_MODULE = loja_brinquedos.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --durations=10
    --maxfail=3
    --disable-warnings
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    api: API tests
    domain: Domain tests
    application: Application tests
    infrastructure: Infrastructure tests
    interface: Interface adapter tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 
